# Atlas v2 — CI test runner.
#
# Triggers on PRs targeting v2.0-showcase (where v2 work lands first) and on
# pushes to v2.0-showcase + main (post-squash-merge verification). Two jobs
# run in parallel, with deliberately distinct charters:
#
#   - `build`: asserts `npm run build` (production / Webpack) compiles.
#   - `e2e-dev`: asserts the Turbopack dev server renders the public map
#     (Playwright). Named explicitly so the green-check semantics are
#     honest — this is the dev-mode guarantee, not a production-runtime
#     one. When G.1 lands `output: 'export'`, the e2e job switches to
#     serving the static `out/` and is renamed accordingly.
#
# Per docs/V2_SHOWCASE_PLAN.md §G.0 + AGENTS.md "Tests are not optional".

name: test

on:
  pull_request:
    branches: [v2.0-showcase, main]
  push:
    branches: [v2.0-showcase, main]

# Cancel in-flight runs when a new commit lands on the same branch so PR
# checks don't pile up behind stale runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match package.json's `engines.node >=20.17` exactly to avoid
          # silent drift if a stricter npm engine check ever lands.
          node-version: "20.17"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Verify Next build compiles
        run: npm run build

  e2e-dev:
    name: Playwright e2e (dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.17"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Hashed off the whole lockfile because the resolved Playwright
          # version sits there (npm only re-pins on lockfile change). Any
          # dep update busts this cache — that's accepted noise; the cost
          # is one chromium re-download per dep bump (~93MB, ~30s on CI).
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e (dev server)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
