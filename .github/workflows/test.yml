# Atlas v2 — CI test runner.
#
# Triggers on PRs targeting v2.0-showcase (where v2 work lands first) and on
# pushes to v2.0-showcase + main (post-squash-merge verification). Runs the
# Next build and the Playwright e2e suite.
#
# Per docs/V2_SHOWCASE_PLAN.md §G.0 + AGENTS.md "Tests are not optional".

name: test

on:
  pull_request:
    branches: [v2.0-showcase, main]
  push:
    branches: [v2.0-showcase, main]

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match package.json's `engines.node >=20.17`. `20` alone resolves
          # to the latest 20.x, which is fine today but drifts silently if
          # a stricter npm engine check ever lands.
          node-version: "20.17"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Hashed off the whole lockfile because the resolved Playwright
          # version sits there (npm only re-pins on lockfile change). Any
          # dep update busts this cache — that's accepted noise; the cost
          # is one chromium re-download per dep bump (~93MB, ~30s on CI).
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Verify Next build still passes
        run: npm run build

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
